[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1440x900x24 -ac -nolisten tcp
priority=10
autorestart=true
startsecs=1
stdout_logfile=/var/log/pc-free/xvfb.log
stderr_logfile=/var/log/pc-free/xvfb-error.log

[program:xfce]
command=/opt/pc-free/start-desktop.sh
environment=DISPLAY=":1",BROWSER_PC_WIDTH="1440",BROWSER_PC_HEIGHT="900"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/var/log/pc-free/xfce.log
stderr_logfile=/var/log/pc-free/xfce-error.log

[program:x11vnc]
command=/bin/bash -lc "for i in {1..60}; do test -S /tmp/.X11-unix/X1 && break; sleep 1; done; exec /usr/bin/x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900 -noxdamage"
priority=30
autorestart=true
startsecs=3
stdout_logfile=/var/log/pc-free/x11vnc.log
stderr_logfile=/var/log/pc-free/x11vnc-error.log

[program:novnc]
command=/bin/bash -lc "for i in {1..60}; do (echo > /dev/tcp/127.0.0.1/5900) >/dev/null 2>&1 && break; sleep 1; done; exec /usr/bin/websockify --web=/opt/pc-free/novnc/ 6080 127.0.0.1:5900"
priority=40
autorestart=true
startsecs=3
stdout_logfile=/var/log/pc-free/novnc.log
stderr_logfile=/var/log/pc-free/novnc-error.log
